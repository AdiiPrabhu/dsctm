[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmstcn"
version = "0.1.0"
description = "Correctness-first D-MSTCN experiment implementation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pyyaml>=6,<7",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

